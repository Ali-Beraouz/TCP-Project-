# TCP chat client - network configuration
# Used only when TCPClient is started WITHOUT arguments.
# Command-line arguments always win:  java -jar TCPClient.jar <ServerIPAddress> <PortNumber>
# Edit the copy next to TCPClient.jar (or pass -Dclient.config=<file>) - no recompilation needed.

# IP address or host name of the machine running TCPServer.
server.host=localhost

# Port the server listens on (server.port in server.properties).
server.port=3000
